openapi: 3.0.3
info:
  title: SmartBadminton Bookings API
  version: 1.0.0
paths:
  /api/bookings:
    post:
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courtId
                - startTime
                - endTime
              properties:
                courtId:
                  type: string
                  format: uuid
                startTime:
                  type: string
                  format: date-time
                  example: 2026-01-30T09:00:00.000Z
                endTime:
                  type: string
                  format: date-time
                  example: 2026-01-30T10:30:00.000Z
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      courtId:
                        type: string
                        format: uuid
                      userId:
                        type: string
                        format: uuid
                      startTime:
                        type: string
                        format: date-time
                      endTime:
                        type: string
                        format: date-time
                      durationMinutes:
                        type: integer
                      unitPrice:
                        type: integer
                      totalPrice:
                        type: integer
                      status:
                        type: string
                        enum:
                          - PENDING_PAYMENT
                          - PAID
                          - CANCELED
                          - EXPIRED
                      expiresAt:
                        type: string
                        format: date-time
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  value:
                    status: error
                    code: VALIDATION_ERROR
                    message: Du lieu khong hop le
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Chua dang nhap
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    status: error
                    code: FORBIDDEN
                    message: Khong co quyen truy cap
        '404':
          description: Court not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                courtNotFound:
                  value:
                    status: error
                    code: COURT_NOT_FOUND
                    message: San khong ton tai
        '409':
          description: Booking overlap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookingOverlap:
                  value:
                    status: error
                    code: BOOKING_OVERLAP
                    message: San da duoc dat trong khung gio nay
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimited:
                  value:
                    status: error
                    code: RATE_LIMITED
                    message: Too many requests, please try again later.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Khong the tao booking
  /api/bookings/{bookingId}/cancel:
    post:
      summary: Cancel booking
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  example: Ban viec dot xuat, khong the den san
      responses:
        '200':
          description: Booking canceled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      bookingId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - CANCELED
                      canceledAt:
                        type: string
                        format: date-time
                      refundPolicy:
                        type: string
                        enum:
                          - REFUND_70
                          - NO_REFUND
                      refundAmount:
                        type: integer
                        example: 0
                      refundStatus:
                        type: string
                        enum:
                          - PENDING_MANUAL
                          - COMPLETED_MANUAL
                          - REJECTED_MANUAL
                      refundTransactionId:
                        type: string
                        format: uuid
        '400':
          description: Invalid cancel payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCancelReason:
                  value:
                    status: error
                    code: INVALID_CANCEL_REASON
                    message: Du lieu khong hop le
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Chua dang nhap
        '403':
          description: Not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookingNotOwned:
                  value:
                    status: error
                    code: BOOKING_NOT_OWNED
                    message: Don dat san khong thuoc nguoi dung hien tai
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookingNotFound:
                  value:
                    status: error
                    code: BOOKING_NOT_FOUND
                    message: Khong tim thay don dat san
        '409':
          description: Booking cannot be canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookingAlreadyCanceled:
                  value:
                    status: error
                    code: BOOKING_ALREADY_CANCELED
                    message: Don dat san da duoc huy
                bookingStatusNotCancellable:
                  value:
                    status: error
                    code: BOOKING_STATUS_NOT_CANCELLABLE
                    message: Trang thai don dat san khong cho phep huy
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Khong the huy booking
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: string
        message:
          type: string

$kind: http-example
request:
  url: "{{baseUrl}}/api/bookings"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "courtId": "<uuid>",
        "startTime": "<dateTime>",
        "endTime": "<dateTime>"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "<string>",
        "code": "<string>",
        "message": "<string>"
      }
order: 7000

$kind: http-request
name: Cancel booking
description: StartFragmentchỉ được hủy **booking có status = PAID**.EndFragment
url: "{{baseUrl}}/api/bookings/{{bookingId}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "reason": "Ly do huy dat san phai tu 10 den 500 ky tu"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "if (pm.response.code >= 200 && pm.response.code < 300) {\r

      \  let json = null;\r

      \  try { json = pm.response.json(); } catch (e) {}\r

      \  if (json && json.data) {\r

      \    if (json.data.refundPolicy)
      pm.collectionVariables.set(\"cancelRefundPolicy\",
      json.data.refundPolicy);\r

      \    if (json.data.refundAmount !== undefined)
      pm.collectionVariables.set(\"cancelRefundAmount\",
      String(json.data.refundAmount));\r

      \    if (json.data.refundTransactionId)
      pm.collectionVariables.set(\"refundTransactionId\",
      json.data.refundTransactionId);\r

      \  }\r

      }\r\n"
    language: text/javascript
examples: ./.resources/Cancel booking.resources/examples
order: 1000

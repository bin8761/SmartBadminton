$kind: http-example
request:
  url: "{{baseUrl}}/api/bookings/:bookingId/cancel"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: bookingId
      value: <uuid>
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "reason": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "<string>",
        "code": "<string>",
        "message": "<string>"
      }
order: 3000

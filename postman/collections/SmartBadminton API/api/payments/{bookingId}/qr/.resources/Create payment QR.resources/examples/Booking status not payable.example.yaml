$kind: http-example
request:
  url: "{{baseUrl}}/api/payments/:bookingId/qr"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: bookingId
      value: <uuid>
      description: "(Required) "
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "<string>",
        "code": "<string>",
        "message": "<string>"
      }
order: 6000

$kind: http-example
request:
  url: "{{baseUrl}}/api/payments/verify"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "bookingId": "<uuid>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "<string>",
        "code": "<string>",
        "message": "<string>"
      }
order: 3000

$kind: http-example
request:
  url: "{{baseUrl}}/api/courts/available?date=<date>&startTime=<string>&endTime=<\
    string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: date
      value: <date>
      description: "(Required) "
    - key: startTime
      value: <string>
      description: "(Required) "
    - key: endTime
      value: <string>
      description: "(Required) "
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "<string>",
        "code": "<string>",
        "message": "<string>"
      }
order: 5000

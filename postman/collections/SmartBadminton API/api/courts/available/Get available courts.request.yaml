$kind: http-request
name: Get available courts
url: "{{baseUrl
  }}/api/courts/available?date=2026-03-26&startTime=<string>&endTime=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: date
    value: 2026-03-26
    description: YYYY-MM-DD
  - key: startTime
    value: <string>
    description: HH:mm (24h)
  - key: endTime
    value: <string>
    description: HH:mm (24h)
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Get available courts.resources/examples
order: 1000

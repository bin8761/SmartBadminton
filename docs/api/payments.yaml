openapi: 3.0.3
info:
  title: SmartBadminton Payments API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sepayApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Apikey <SEPAY_IPN_API_KEY>'
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: string
        message:
          type: string
paths:
  /api/payments/{bookingId}/qr:
    post:
      summary: Create payment QR
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: QR created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      paymentTransactionId:
                        type: string
                        format: uuid
                      qrString:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  value:
                    status: error
                    code: VALIDATION_ERROR
                    message: Du lieu khong hop le
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Chua dang nhap
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    status: error
                    code: FORBIDDEN
                    message: Khong co quyen truy cap
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookingNotFound:
                  value:
                    status: error
                    code: BOOKING_NOT_FOUND
                    message: Khong tim thay don dat
        '409':
          description: Booking status not payable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookingStatusNotPayable:
                  value:
                    status: error
                    code: BOOKING_STATUS_NOT_PAYABLE
                    message: Trang thai don dat san khong cho phep thanh toan
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Khong the tao QR thanh toan
  /api/payments/verify:
    post:
      summary: Verify payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
              properties:
                bookingId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Payment verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      paymentTransactionId:
                        type: string
                        format: uuid
                        nullable: true
                      paymentStatus:
                        type: string
                        enum:
                          - PAID
                          - FAILED
                          - PENDING
                          - EXPIRED
                      paidAt:
                        type: string
                        format: date-time
                        nullable: true
                      provider:
                        type: string
                        nullable: true
                      amount:
                        type: integer
                        nullable: true
                      currency:
                        type: string
                        nullable: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  value:
                    status: error
                    code: VALIDATION_ERROR
                    message: Du lieu khong hop le
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Chua dang nhap
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    status: error
                    code: FORBIDDEN
                    message: Khong co quyen truy cap
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    status: error
                    code: USER_NOT_FOUND
                    message: Nguoi dung khong ton tai
                bookingNotFound:
                  value:
                    status: error
                    code: BOOKING_NOT_FOUND
                    message: Khong tim thay don dat
                paymentNotFound:
                  value:
                    status: error
                    code: PAYMENT_NOT_FOUND
                    message: Khong tim thay thanh toan
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Khong the xac minh thanh toan
  /api/payments/webhooks/sepay:
    post:
      summary: SePay webhook
      security:
        - sepayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_code:
                  type: string
                  nullable: true
                content:
                  type: string
                  nullable: true
                transaction_content:
                  type: string
                  nullable: true
                amount:
                  oneOf:
                    - type: number
                    - type: string
                  nullable: true
                transfer_type:
                  type: string
                  nullable: true
                transaction_id:
                  oneOf:
                    - type: number
                    - type: string
                  nullable: true
                transaction_date:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Webhook received
        '401':
          description: Invalid signature
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Khong the xu ly webhook

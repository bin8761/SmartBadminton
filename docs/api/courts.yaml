openapi: 3.0.3
info:
  title: SmartBadminton Courts API
  version: 1.0.0
paths:
  /api/courts/available:
    get:
      tags:
        - Courts
      operationId: getAvailableCourts
      summary: Get available courts
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: true
          example: 2026-01-25
        - in: query
          name: startTime
          required: true
          example: '06:00'
        - in: query
          name: endTime
          required: true
          example: '09:00'
      responses:
        '200':
          description: Available courts
          content:
            application/json:
              examples:
                success:
                  value:
                    status: success
                    data:
                      date: 2026-01-25
                      startTime: '06:00'
                      endTime: '09:00'
                      durationMinutes: 180
                      courts:
                        - id: 11111111-1111-1111-1111-111111111111
                          name: San so 1
                          type: SINGLE
                          basePrice: 120000
        '400':
          description: Validation error
          content:
            application/json:
              examples:
                validationError:
                  value:
                    status: error
                    code: VALIDATION_ERROR
                    message: Du lieu khong hop le
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Chua dang nhap
        '403':
          description: Forbidden
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    status: error
                    code: FORBIDDEN
                    message: Khong co quyen truy cap
        '404':
          description: No available courts
          content:
            application/json:
              examples:
                noAvailableCourts:
                  value:
                    status: error
                    code: NO_AVAILABLE_COURTS
                    message: Khong co san phu hop trong khung gio da chon
        '500':
          description: Server error
          content:
            application/json:
              examples:
                internalError:
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Khong the lay danh sach san
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
